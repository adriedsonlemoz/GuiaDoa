name: Flutter - Android Web iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'flutter/**'
      - 'mobile/android-version.json'
      - 'package.json'
      - '.github/workflows/flutter-multiplatform.yml'

permissions:
  contents: write

concurrency:
  group: flutter-primary-${{ github.ref }}
  cancel-in-progress: true

env:
  API_URL: ${{ secrets.FLUTTER_API_URL || secrets.VITE_API_URL || 'https://guiadoa-agrq.onrender.com' }}

jobs:
  android-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap platforms
        working-directory: flutter
        run: bash ./tool/bootstrap_platforms.sh
      - name: Validate Android internet permission
        working-directory: flutter
        run: grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
      - name: Analyze
        working-directory: flutter
        run: flutter analyze
      - name: Test
        working-directory: flutter
        run: flutter test
      - name: Build Web
        working-directory: flutter
        run: flutter build web --release --dart-define=API_URL="$API_URL"
      - name: Build Android APK
        working-directory: flutter
        run: flutter build apk --release --dart-define=API_URL="$API_URL"
      - name: Prepare primary Flutter APK
        id: meta
        shell: bash
        run: |
          VERSION_LINE="$(awk '/^version:/{print $2; exit}' flutter/pubspec.yaml)"
          APP_VERSION="${VERSION_LINE%%+*}"
          ALPHA="$(sed -nE "s/.*flutterChannel = 'Flutter alpha\.([0-9]+)'.*/\1/p" flutter/lib/core/config/app_config.dart)"
          if [ -z "$APP_VERSION" ] || [ -z "$ALPHA" ]; then
            echo "::error::Não foi possível ler versão/alpha do Flutter."
            exit 1
          fi
          APK_NAME="GuiaDOA-FLUTTER-${APP_VERSION#1.0.0-}-alpha.${ALPHA}.apk"
          TAG="v${APP_VERSION}-flutter-alpha.${ALPHA}"
          mkdir -p release-apk
          cp flutter/build/app/outputs/flutter-apk/app-release.apk "release-apk/$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          test -s "release-apk/$APK_NAME"
      - name: Publish Flutter APK as Release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          TAG: ${{ steps.meta.outputs.tag }}
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Guia Doa $APP_VERSION - Flutter" --notes "Build principal Flutter para Android. Web e iOS são validados no mesmo workflow."
          fi
          gh release upload "$TAG" "release-apk/$APK_NAME" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"

  ios-no-codesign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap platforms
        working-directory: flutter
        run: bash ./tool/bootstrap_platforms.sh
      - name: Analyze
        working-directory: flutter
        run: flutter analyze
      - name: Build iOS without signing
        working-directory: flutter
        run: flutter build ios --release --no-codesign --dart-define=API_URL="$API_URL"
