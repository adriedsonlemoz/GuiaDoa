name: Flutter - Android Web iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-multiplatform.yml'

jobs:
  android-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap platforms
        working-directory: flutter
        run: ./tool/bootstrap_platforms.sh
      - name: Analyze
        working-directory: flutter
        run: flutter analyze
      - name: Test
        working-directory: flutter
        run: flutter test
      - name: Build Web
        working-directory: flutter
        run: flutter build web --release
      - name: Build Android APK
        working-directory: flutter
        run: flutter build apk --release

  ios-no-codesign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap platforms
        working-directory: flutter
        run: ./tool/bootstrap_platforms.sh
      - name: Analyze
        working-directory: flutter
        run: flutter analyze
      - name: Build iOS without signing
        working-directory: flutter
        run: flutter build ios --release --no-codesign
