name: Flutter Principal - Android Web iOS

on:
  push:
    branches: [main, master]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-multiplatform.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-multiplatform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-principal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-web:
    name: Flutter principal - Android + Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ler identidade da build Flutter
        id: release
        working-directory: flutter
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('release.json', encoding='utf-8'))
          print(f"version={data['version']}")
          print(f"version_code={data['versionCode']}")
          print(f"channel={data['channel']}")
          print(f"apk_name={data['apkName']}")
          PY

      - name: Bootstrap platforms
        working-directory: flutter
        run: ./tool/bootstrap_platforms.sh

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      - name: Test
        working-directory: flutter
        run: flutter test

      - name: Build Web
        working-directory: flutter
        run: flutter build web --release --dart-define=BUILD_FAMILY=FLUTTER

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: guiadoa-debug-keystore-v1

      - name: Build Android APK principal
        working-directory: flutter
        run: flutter build apk --release --dart-define=BUILD_FAMILY=FLUTTER

      - name: Preparar APK Flutter identificável
        if: github.event_name != 'pull_request'
        env:
          APK_NAME: ${{ steps.release.outputs.apk_name }}
        run: |
          mkdir -p release-apk
          cp flutter/build/app/outputs/flutter-apk/app-release.apk "release-apk/$APK_NAME"
          test -s "release-apk/$APK_NAME"

      - name: Publicar APK Flutter na Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
        run: |
          TAG="v${VERSION}-flutter-${CHANNEL}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "Guia DOA $VERSION - Flutter $CHANNEL" \
            --notes "APK PRINCIPAL NOVO EM FLUTTER. O nome do arquivo e o próprio app exibem FLUTTER para não confundir com a versão React/Capacitor legada."
          gh release upload "$TAG" "release-apk/$APK_NAME" --clobber
          gh release view "$TAG" --json assets > "$RUNNER_TEMP/flutter-release-assets.json"
          python3 - <<'PY'
          import json, os
          data=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'flutter-release-assets.json'), encoding='utf-8'))
          assets=data.get('assets',[])
          expected=os.environ['APK_NAME']
          assert len(assets)==1, f'A Release Flutter deve conter somente o APK principal, recebeu {len(assets)} assets.'
          assert assets[0]['name']==expected, (assets[0]['name'], expected)
          assert assets[0]['state']=='uploaded'
          PY
          gh release edit "$TAG" --draft=false --prerelease=true --latest=false
          printf '## APK principal Flutter\n\n**%s**\n\n[Baixar APK](https://github.com/%s/releases/download/%s/%s)\n' "$APK_NAME" "$GH_REPO" "$TAG" "$APK_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo Web
        run: |
          printf 'Flutter Web compilado em `flutter/build/web`.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'A build Android principal é Flutter; o workflow React/Capacitor ficou somente manual e legado.\n' >> "$GITHUB_STEP_SUMMARY"

  ios-no-codesign:
    name: Flutter principal - iOS sem assinatura
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap platforms
        working-directory: flutter
        run: ./tool/bootstrap_platforms.sh
      - name: Analyze
        working-directory: flutter
        run: flutter analyze
      - name: Build iOS without signing
        working-directory: flutter
        run: flutter build ios --release --no-codesign --dart-define=BUILD_FAMILY=FLUTTER
