<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guia DOA — Gerenciar Traduções</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #1C3A5E;
      --navy2:   #2A4C72;
      --gold:    #C8A84A;
      --gold2:   rgba(200,168,74,0.25);
      --cream:   #F2EADA;
      --cream2:  #EAE0C8;
      --muted:   #9A7D56;
      --text:    #3E2F1C;
      --text2:   #6E5A3C;
      --success: #2E7D52;
      --danger:  #A83C2C;
      --warn:    #B8860B;
      --bg:      #F8F4E8;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--cream2);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      border-bottom: 2px solid rgba(200,168,74,0.4);
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    header h1 {
      font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(200,168,74,0.9); font-weight: 700;
    }
    header nav { display: flex; gap: 8px; }
    header a {
      color: rgba(248,242,224,0.6); font-size: 0.75rem;
      text-decoration: none; padding: 4px 10px;
      border: 1px solid rgba(200,168,74,0.2); border-radius: 6px;
      transition: all 0.15s;
    }
    header a:hover { color: var(--gold); border-color: rgba(200,168,74,0.5); }

    /* ── Layout ── */
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      background: var(--cream); border: 1.5px solid var(--gold2);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
    }
    .toolbar select {
      background: var(--bg); border: 1.5px solid var(--gold2);
      border-radius: 8px; color: var(--text); padding: 7px 12px;
      font-size: 0.82rem; cursor: pointer; outline: none;
    }
    .toolbar .sep { flex: 1; }
    .stats {
      font-size: 0.72rem; color: var(--muted);
      display: flex; gap: 14px;
    }
    .stats span strong { color: var(--text); }

    /* ── Botões ── */
    .btn {
      border: none; border-radius: 8px; cursor: pointer;
      font-size: 0.75rem; font-family: inherit; font-weight: 600;
      letter-spacing: 0.05em; padding: 8px 14px;
      display: inline-flex; align-items: center; gap: 5px;
      transition: all 0.15s; text-transform: uppercase;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--navy2), var(--navy));
      color: rgba(200,168,74,0.95);
      border: 1.5px solid rgba(200,168,74,0.4);
    }
    .btn-primary:hover { filter: brightness(1.15); }
    .btn-outline {
      background: var(--bg); color: var(--text2);
      border: 1.5px solid var(--gold2);
    }
    .btn-outline:hover { border-color: var(--gold); color: var(--text); }
    .btn-success { background: var(--success); color: #fff; border: none; }
    .btn-danger  { background: var(--danger);  color: #fff; border: none; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }

    /* ── Filtros de status ── */
    .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .filtro {
      font-size: 0.68rem; padding: 4px 12px; border-radius: 100px;
      border: 1.5px solid var(--gold2); background: transparent;
      color: var(--muted); cursor: pointer; font-family: inherit;
      letter-spacing: 0.06em; text-transform: uppercase;
      transition: all 0.13s;
    }
    .filtro.ativo {
      background: linear-gradient(135deg, var(--navy2), var(--navy));
      color: rgba(200,168,74,0.9); border-color: rgba(200,168,74,0.5);
    }

    /* ── Tabela ── */
    .tabela-wrap {
      background: var(--cream); border: 1.5px solid var(--gold2);
      border-radius: 12px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: linear-gradient(135deg, var(--navy), var(--navy2)); }
    thead th {
      padding: 10px 14px; text-align: left;
      font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(200,168,74,0.8); font-weight: 600; white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid rgba(200,168,74,0.12); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(200,168,74,0.04); }
    td { padding: 10px 14px; font-size: 0.8rem; vertical-align: middle; }

    .td-chave   { color: var(--muted); font-family: monospace; font-size: 0.72rem; max-width: 200px; word-break: break-all; }
    .td-pt      { color: var(--text2); max-width: 200px; }
    .td-en      { max-width: 240px; }
    .td-en input {
      width: 100%; background: var(--bg);
      border: 1.5px solid var(--gold2); border-radius: 7px;
      color: var(--text); padding: 6px 10px; font-size: 0.8rem;
      font-family: inherit; outline: none; transition: border-color 0.15s;
    }
    .td-en input:focus { border-color: var(--gold); }

    .badge {
      display: inline-flex; align-items: center;
      font-size: 0.62rem; padding: 2px 8px; border-radius: 100px;
      font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      white-space: nowrap;
    }
    .badge-rascunho { background: rgba(184,134,11,0.15);  color: var(--warn);    border: 1px solid rgba(184,134,11,0.3); }
    .badge-revisado { background: rgba(46,125,82,0.12);   color: var(--success); border: 1px solid rgba(46,125,82,0.3); }
    .badge-ativo    { background: rgba(28,58,94,0.12);    color: var(--navy2);   border: 1px solid rgba(28,58,94,0.3); }
    .badge-sem      { background: rgba(168,60,44,0.12);   color: var(--danger);  border: 1px solid rgba(168,60,44,0.3); }

    .acoes { display: flex; gap: 5px; white-space: nowrap; }
    .btn-sm { padding: 5px 9px; font-size: 0.65rem; border-radius: 6px; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      color: rgba(200,168,74,0.95); border: 1px solid rgba(200,168,74,0.4);
      padding: 9px 22px; border-radius: 100px; font-size: 0.78rem;
      opacity: 0; transition: all 0.22s; pointer-events: none;
      box-shadow: 0 4px 18px rgba(15,30,53,0.4); z-index: 9999;
      letter-spacing: 0.04em;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Loading overlay ── */
    #loading {
      display: none; position: fixed; inset: 0;
      background: rgba(15,25,45,0.55); backdrop-filter: blur(3px);
      align-items: center; justify-content: center; z-index: 200;
    }
    #loading.show { display: flex; }
    .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(200,168,74,0.2);
      border-top-color: var(--gold);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty state ── */
    .empty {
      text-align: center; padding: 48px 24px; color: var(--muted);
    }
    .empty h3 { font-size: 1rem; margin-bottom: 8px; color: var(--text2); }
    .empty p  { font-size: 0.78rem; line-height: 1.6; }

    /* ── Responsivo ── */
    @media (max-width: 700px) {
      .td-chave, .td-pt { display: none; }
      .stats { display: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>◆ Guia DOA — Traduções</h1>
  <nav>
    <a href="/admin">← Admin</a>
    <a href="/admin/setup.html">Setup</a>
  </nav>
</header>

<div class="container">

  <!-- Toolbar -->
  <div class="toolbar">
    <label style="font-size:0.75rem;color:var(--muted);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">Idioma</label>
    <select id="sel-locale" onchange="trocarLocale()">
      <option value="en-US">🇺🇸 English (en-US)</option>
    </select>

    <button class="btn btn-primary" onclick="autoTraduzirTodos()" id="btn-auto">
      ⚡ Auto-traduzir pendentes
    </button>
    <button class="btn btn-outline" onclick="sincronizarChaves()" id="btn-sync">
      ↻ Sincronizar chaves
    </button>
    <button class="btn btn-success btn-sm" onclick="ativarRevisados()" title="Ativa todos os revisados">
      ✓ Ativar revisados
    </button>

    <div class="sep"></div>

    <div class="stats" id="stats">
      <span><strong id="st-total">–</strong> chaves</span>
      <span style="color:var(--warn)"><strong id="st-rascunho">–</strong> rascunho</span>
      <span style="color:var(--success)"><strong id="st-ativo">–</strong> ativos</span>
    </div>
  </div>

  <!-- Filtros de status -->
  <div class="filtros">
    <button class="filtro ativo" data-status="todos"    onclick="filtrar(this)">Todos</button>
    <button class="filtro"       data-status="sem"      onclick="filtrar(this)">Sem tradução</button>
    <button class="filtro"       data-status="rascunho" onclick="filtrar(this)">Rascunho</button>
    <button class="filtro"       data-status="revisado" onclick="filtrar(this)">Revisado</button>
    <button class="filtro"       data-status="ativo"    onclick="filtrar(this)">Ativo</button>
  </div>

  <!-- Tabela -->
  <div class="tabela-wrap">
    <table>
      <thead>
        <tr>
          <th>Chave</th>
          <th>🇧🇷 Português</th>
          <th>🇺🇸 Tradução</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
        <tr><td colspan="5"><div class="empty"><h3>Carregando…</h3></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Loading -->
<div id="loading"><div class="spinner"></div></div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const API = window.location.origin;
let TOKEN  = localStorage.getItem('doa_token') || '';
let locale = 'en-US';
let dados  = [];
let filtroAtivo = 'todos';

// Redireciona para login se não houver token
if (!TOKEN) {
  const t = prompt('Token de admin (JWT):');
  if (!t) { location.href = '/admin'; }
  else { TOKEN = t; localStorage.setItem('doa_token', t); }
}

const H = () => ({ 'Content-Type': 'application/json', Authorization: `Bearer ${TOKEN}` });

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

// ── Loading ───────────────────────────────────────────────────────────────────
const loading = (show) => document.getElementById('loading').classList.toggle('show', show);

// ── Carregar dados ────────────────────────────────────────────────────────────
async function carregar() {
  loading(true);
  try {
    const r = await fetch(`${API}/api/traducoes/admin?locale=${locale}`, { headers: H() });
    if (r.status === 401) { toast('⚠ Token inválido'); loading(false); return; }
    dados = await r.json();
    renderizar();
    atualizarStats();
  } catch (e) {
    toast('Erro ao carregar: ' + e.message);
  }
  loading(false);
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function atualizarStats() {
  document.getElementById('st-total').textContent    = dados.length;
  document.getElementById('st-rascunho').textContent = dados.filter(d => d.status === 'rascunho').length;
  document.getElementById('st-ativo').textContent    = dados.filter(d => d.status === 'ativo').length;
}

// ── Filtrar ───────────────────────────────────────────────────────────────────
function filtrar(btn) {
  document.querySelectorAll('.filtro').forEach(b => b.classList.remove('ativo'));
  btn.classList.add('ativo');
  filtroAtivo = btn.dataset.status;
  renderizar();
}

function dadosFiltrados() {
  if (filtroAtivo === 'todos')    return dados;
  if (filtroAtivo === 'sem')      return dados.filter(d => !d.traducao);
  return dados.filter(d => d.status === filtroAtivo);
}

// ── Badge ─────────────────────────────────────────────────────────────────────
function badge(doc) {
  if (!doc.traducao) return '<span class="badge badge-sem">Sem tradução</span>';
  const map = { rascunho: 'badge-rascunho', revisado: 'badge-revisado', ativo: 'badge-ativo' };
  const labels = { rascunho: 'Rascunho', revisado: 'Revisado', ativo: '✓ Ativo' };
  return `<span class="badge ${map[doc.status]}">${labels[doc.status]}</span>`;
}

// ── Renderizar tabela ─────────────────────────────────────────────────────────
function renderizar() {
  const lista = dadosFiltrados();
  const corpo = document.getElementById('corpo-tabela');

  if (!lista.length) {
    corpo.innerHTML = `<tr><td colspan="5"><div class="empty">
      <h3>Nenhuma tradução aqui</h3>
      <p>Tente outro filtro ou clique em <strong>Sincronizar chaves</strong> para importar as chaves base.</p>
    </div></td></tr>`;
    return;
  }

  corpo.innerHTML = lista.map(doc => `
    <tr id="row-${doc._id}">
      <td class="td-chave">${doc.chave}</td>
      <td class="td-pt">${esc(doc.textoPT)}</td>
      <td class="td-en">
        <input id="input-${doc._id}" value="${esc(doc.traducao)}"
          placeholder="Sem tradução…"
          onchange="marcarEditado('${doc._id}')"
          onkeydown="if(event.key==='Enter'){salvar('${doc._id}')}" />
      </td>
      <td id="badge-${doc._id}">${badge(doc)}</td>
      <td class="acoes">
        <button class="btn btn-outline btn-sm" onclick="autoTraduzirUm('${doc._id}','${doc.chave}')" title="Auto-traduzir esta linha">⚡</button>
        <button class="btn btn-outline btn-sm" onclick="salvar('${doc._id}')">Salvar</button>
        <button class="btn btn-success btn-sm" onclick="mudarStatus('${doc._id}','revisado')" title="Marcar como revisado">✓</button>
        <button class="btn btn-primary btn-sm" onclick="mudarStatus('${doc._id}','ativo')" title="Ativar no app">Ativar</button>
      </td>
    </tr>`).join('');
}

function esc(str = '') {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function marcarEditado(id) {
  const badge = document.getElementById(`badge-${id}`);
  if (badge) badge.innerHTML = '<span class="badge badge-rascunho">Editado</span>';
}

// ── Salvar tradução manual ────────────────────────────────────────────────────
async function salvar(id) {
  const input = document.getElementById(`input-${id}`);
  const traducao = input.value.trim();
  try {
    const r = await fetch(`${API}/api/traducoes/${id}`, {
      method: 'PATCH', headers: H(),
      body: JSON.stringify({ traducao, status: 'revisado' }),
    });
    const doc = await r.json();
    // Atualiza local
    const idx = dados.findIndex(d => d._id === id);
    if (idx !== -1) dados[idx] = doc;
    document.getElementById(`badge-${id}`).innerHTML = badge(doc);
    toast('✓ Salvo');
  } catch (e) { toast('Erro: ' + e.message); }
}

// ── Mudar status ──────────────────────────────────────────────────────────────
async function mudarStatus(id, status) {
  try {
    const r = await fetch(`${API}/api/traducoes/${id}`, {
      method: 'PATCH', headers: H(),
      body: JSON.stringify({ status }),
    });
    const doc = await r.json();
    const idx = dados.findIndex(d => d._id === id);
    if (idx !== -1) dados[idx] = doc;
    document.getElementById(`badge-${id}`).innerHTML = badge(doc);
    atualizarStats();
    toast(status === 'ativo' ? '✓ Ativado no app!' : '✓ Marcado como revisado');
  } catch (e) { toast('Erro: ' + e.message); }
}

// ── Auto-traduzir uma linha ───────────────────────────────────────────────────
async function autoTraduzirUm(id, chave) {
  loading(true);
  try {
    const r = await fetch(`${API}/api/traducoes/auto`, {
      method: 'POST', headers: H(),
      body: JSON.stringify({ chave, locale }),
    });
    const res = await r.json();
    if (res.erros?.length) { toast('⚠ Erro na tradução: ' + res.erros[0].erro); loading(false); return; }
    // Recarrega só essa linha
    await carregar();
    toast('⚡ Tradução automática gerada — revise antes de ativar');
  } catch (e) { toast('Erro: ' + e.message); }
  loading(false);
}

// ── Auto-traduzir todos pendentes ─────────────────────────────────────────────
async function autoTraduzirTodos() {
  if (!confirm('Traduzir automaticamente todas as chaves sem tradução?\nOs rascunhos gerados precisarão ser revisados antes de ir ao ar.')) return;
  loading(true);
  try {
    const r = await fetch(`${API}/api/traducoes/auto`, {
      method: 'POST', headers: H(),
      body: JSON.stringify({ locale }),
    });
    const res = await r.json();
    await carregar();
    const msg = res.erros?.length
      ? `⚡ ${res.traduzidos} traduzidos, ${res.erros.length} erros`
      : `⚡ ${res.traduzidos} traduzidos! Revise antes de ativar.`;
    toast(msg, 4000);
  } catch (e) { toast('Erro: ' + e.message); }
  loading(false);
}

// ── Sincronizar chaves da Home ────────────────────────────────────────────────
// Chaves hardcoded aqui — espelham o src/locales/pt-BR.js
const CHAVES_HOME = [
  { chave:'home.saudacao.bom_dia',    textoPT:'Bom dia'               },
  { chave:'home.saudacao.boa_tarde',  textoPT:'Boa tarde'             },
  { chave:'home.saudacao.boa_noite',  textoPT:'Boa noite'             },
  { chave:'home.saudacao.comandante', textoPT:'Comandante'            },
  { chave:'home.saudacao.aviso',      textoPT:'Sua aliança conta com você.' },
  { chave:'home.arsenal.titulo',      textoPT:'Arsenal'               },
  { chave:'home.botao.torneios',      textoPT:'Torneios'              },
  { chave:'home.botao.torneios.sub',  textoPT:'Metas & rankings'      },
  { chave:'home.botao.tropas',        textoPT:'Tropas'                },
  { chave:'home.botao.tropas.sub',    textoPT:'Enciclopédia'          },
  { chave:'home.botao.dragoes',       textoPT:'Dragões'               },
  { chave:'home.botao.dragoes.sub',   textoPT:'Evolução & poder'      },
  { chave:'home.botao.edificios',     textoPT:'Construções'           },
  { chave:'home.botao.edificios.sub', textoPT:'Níveis & efeitos'      },
  { chave:'home.botao.itens',         textoPT:'Itens'                 },
  { chave:'home.botao.itens.sub',     textoPT:'Armazém'               },
  { chave:'home.botao.niveis',        textoPT:'Níveis'                },
  { chave:'home.botao.niveis.sub',    textoPT:'Tabela de XP'          },
  { chave:'home.botao.ilhas',         textoPT:'Cidade'                },
  { chave:'home.botao.ilhas.sub',     textoPT:'Sua ilha'              },
  { chave:'home.botao.pesquisas',     textoPT:'Pesquisas'             },
  { chave:'home.botao.pesquisas.sub', textoPT:'Centro de Ciência'     },
  { chave:'home.botao.sobre',         textoPT:'Info'                  },
  { chave:'home.botao.sobre.sub',     textoPT:'Sobre o app'           },
  { chave:'home.botao.texto_colorido',     textoPT:'Texto Colorido'   },
  { chave:'home.botao.texto_colorido.sub', textoPT:'Builder de cores' },
  { chave:'home.conselheiro.titulo',  textoPT:'Conselheiro Tático'    },
  { chave:'home.hora.servidor',       textoPT:'Hora do servidor'      },
  { chave:'home.hora.local',          textoPT:'Hora local'            },
  { chave:'home.perfil.editar',       textoPT:'Editar perfil'         },
  { chave:'home.perfil.sair',         textoPT:'Sair'                  },
  { chave:'home.perfil.reino',        textoPT:'Reino'                 },
  { chave:'home.perfil.alianca',      textoPT:'Aliança'               },
  { chave:'home.perfil.poder',        textoPT:'Poder'                 },
];

async function sincronizarChaves() {
  loading(true);
  try {
    const r = await fetch(`${API}/api/traducoes/seed`, {
      method: 'POST', headers: H(),
      body: JSON.stringify({ chaves: CHAVES_HOME, locale }),
    });
    const res = await r.json();
    await carregar();
    toast(`↻ ${res.inseridos} novas chaves, ${res.existentes} já existentes`);
  } catch (e) { toast('Erro: ' + e.message); }
  loading(false);
}

// ── Ativar todos revisados ────────────────────────────────────────────────────
async function ativarRevisados() {
  if (!confirm('Ativar todas as traduções revisadas no app?')) return;
  loading(true);
  try {
    const r = await fetch(`${API}/api/traducoes/ativar-todos`, {
      method: 'POST', headers: H(),
      body: JSON.stringify({ locale }),
    });
    const res = await r.json();
    await carregar();
    toast(`✓ ${res.ativados} traduções ativadas!`);
  } catch (e) { toast('Erro: ' + e.message); }
  loading(false);
}

// ── Trocar locale ─────────────────────────────────────────────────────────────
function trocarLocale() {
  locale = document.getElementById('sel-locale').value;
  carregar();
}

// ── Init ──────────────────────────────────────────────────────────────────────
carregar();
</script>
</body>
</html>
